[project]
name = "tainttrace"
version = "0.1.0"
description = "Retraction-aware retrieval for scientific question answering"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Minato-sudo", email = "i232548@isb.nu.edu.pk" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.10.0",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "rapidfuzz>=3.14.6",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
tainttrace = "tainttrace.cli:main"

[project.optional-dependencies]
cpu = ["fastembed>=0.9.1"]
gpu = ["fastembed-gpu>=0.9.1", "onnxruntime-gpu[cuda,cudnn]>=1.32"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]
