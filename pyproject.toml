[project]
name = "tainttrace"
version = "0.1.0"
description = "Retraction-aware retrieval for scientific question answering"
readme = "README.md"
authors = [
    { name = "Minato-sudo", email = "i232548@isb.nu.edu.pk" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "rapidfuzz>=3.14.6",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
tainttrace = "tainttrace.cli:main"
